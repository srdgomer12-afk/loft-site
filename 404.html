<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0b0a">
  <title>Sayfa bulunamadı | LOFT</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    html, body { height: 100%; margin: 0; background: #0b0b0a; color: #ece6d8; }
    body { display: grid; place-items: center; padding: 2rem; text-align: center; font: 400 1.1rem/1.6 "Jost", "Futura", "Segoe UI", system-ui, sans-serif; }
    .code { font-weight: 300; font-size: clamp(5rem, 24vw, 12rem); line-height: 1; letter-spacing: .08em; background: linear-gradient(135deg, #8a6a2c, #f4e3b0 50%, #c9a45c); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { margin: .75rem 0 2rem; color: #a8a295; }
    a { display: inline-block; padding: .95rem 2rem; background: linear-gradient(135deg, #8a6a2c, #d6b566 30%, #f4e3b0 50%, #c9a45c 75%, #8a6a2c); color: #0b0b0a; border-radius: 2px; font-weight: 500; letter-spacing: .08em; text-decoration: none; }
    a:focus-visible { outline: 2px solid #efdca8; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true">404</div>
    <h1 style="font-weight:300;font-size:1.6rem;margin:.5rem 0 0">Aradığınız sayfa bulunamadı.</h1>
    <p>Adres değişmiş ya da yanlış yazılmış olabilir.</p>
    <a href="/">Ana sayfaya dön</a>
  </main>
</body>
</html>
